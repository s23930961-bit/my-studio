<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社群貼文工作台</title>
  <style>
    :root {
      --brand: #a3b1c6;
      --brand-deep: #526177;
      --brand-pale: #edf1f6;
      --paper: #ffffff;
      --canvas: #f5f6f8;
      --ink: #263243;
      --muted: #687586;
      --line: #dbe1e9;
      --focus: #294f88;
      --success: #2e6653;
      --warning: #975c22;
      --overlay: rgba(38, 50, 67, .48);
      --shadow: 0 14px 36px rgba(38, 50, 67, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.55;
    }
    button, input, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .topbar {
      min-height: 84px;
      padding: 20px clamp(20px, 4vw, 64px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--brand);
      border-bottom: 1px solid var(--brand-deep);
    }
    .topbar h1 { margin: 0; font-size: clamp(1.25rem, 2vw, 1.75rem); letter-spacing: .02em; }
    .topbar p { margin: 0; color: var(--ink); font-size: .86rem; }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .topbar-button, .material-button, .dialog-button {
      padding: 9px 14px;
      border: 1px solid var(--brand-deep);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
    }
    .topbar-button:hover, .material-button:hover, .dialog-button:hover { background: var(--brand-pale); }
    .progress-board {
      width: min(100% - 32px, 1504px);
      margin: 22px auto 0;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .progress-board h2 { flex: none; font-size: .9rem; }
    .progress-steps { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .progress-steps li { padding: 5px 10px; border-radius: 999px; color: var(--muted); font-size: .78rem; }
    .progress-steps li.is-current { background: var(--brand-pale); color: var(--ink); font-weight: 700; }
    .progress-steps li.is-done { color: var(--success); }
    .workspace {
      width: min(100%, 1600px);
      margin: 0 auto;
      padding: 28px clamp(16px, 3vw, 48px) 44px;
      display: grid;
      grid-template-columns: minmax(280px, 1.04fr) minmax(340px, 1.25fr) minmax(280px, .9fr);
      gap: 20px;
      align-items: start;
    }
    .panel {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-head { padding: 22px 24px 18px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 4px; color: var(--brand-deep); font-size: .74rem; font-weight: 700; letter-spacing: .13em; }
    h2 { margin: 0; font-size: 1.18rem; }
    .panel-head p:last-child { margin: 7px 0 0; color: var(--muted); font-size: .86rem; }
    .form-fields { display: grid; gap: 20px; padding: 22px 24px 28px; }
    .material-actions { padding: 0 24px 28px; }
    .material-status { margin: 12px 0 0; font-size: .85rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .material-status.is-error { color: #b42318; }
    .ai-settings-group { display: grid; gap: 12px; margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 10px; }
    .ai-settings-group legend { padding: 0 6px; font-weight: 700; }
    .dialog-fields select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: var(--paper); }
    .material-button { width: 100%; background: var(--brand-pale); }
    #write-with-ai:disabled { background: #d8dce3; border-color: #aeb6c1; color: #626b79; cursor: not-allowed; }
    .material-button + .material-button { margin-top: 10px; }
    .field { display: grid; gap: 7px; }
    .field label { font-weight: 700; font-size: .9rem; }
    .requirement { margin-left: 6px; color: var(--muted); font-size: .75rem; font-weight: 500; }
    .field input, .field textarea, .post-editor {
      width: 100%;
      padding: 11px 13px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      resize: vertical;
    }
    .field input::placeholder, .field textarea::placeholder, .post-editor::placeholder { color: var(--muted); opacity: .9; }
    .field textarea { min-height: 76px; }
    .field:nth-child(7) textarea, .field:nth-child(8) textarea { background: var(--brand-pale); }
    .editor-body { padding: 22px 24px 26px; }
    .tabs { display: flex; gap: 8px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .tab {
      min-width: 78px;
      padding: 8px 18px;
      border: 1px solid var(--brand-deep);
      border-radius: 999px;
      background: var(--brand-pale);
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--brand); }
    .editor-label { display: block; margin: 22px 0 9px; font-weight: 700; }
    .post-editor { min-height: 520px; line-height: 1.85; }
    .helper { margin: 10px 0 0; color: var(--muted); font-size: .8rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
    .action {
      padding: 9px 13px;
      border: 1px solid var(--brand-deep);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
    }
    .action:hover { background: var(--brand-pale); }
    .action.primary { background: var(--brand); }
    .action:disabled { cursor: not-allowed; opacity: .5; }
    .action.secondary { display: none; }
    .action.secondary.is-visible { display: inline-block; }
    .feedback { margin: 13px 0 0; min-height: 1.5em; font-size: .85rem; white-space: pre-line; }
    .feedback.success { color: var(--success); }
    .feedback.warning { color: var(--warning); }
    .ai-helper { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .ai-helper h3 { margin: 0 0 12px; font-size: 1rem; }
    .helper-history { display: grid; gap: 9px; max-height: 280px; overflow-y: auto; margin-bottom: 12px; }
    .helper-message { padding: 10px 12px; border-radius: 10px; background: var(--brand-pale); white-space: pre-wrap; overflow-wrap: anywhere; font-size: .84rem; }
    .helper-message.is-assistant { background: var(--canvas); }
    .helper-message strong { display: block; margin-bottom: 4px; }
    .helper-shortcuts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .helper-compose { display: flex; gap: 8px; }
    .helper-compose input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; }
    .review-report { max-height: 65vh; overflow-y: auto; margin-top: 18px; line-height: 1.6; }
    .review-line { padding: 5px 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .review-line.is-fail { background: #fde5e2; }
    .review-line.is-warning { background: #fff0bf; }
    .review-replies { display: grid; gap: 12px; margin-top: 20px; }
    .review-replies[hidden] { display: none; }
    .review-reply { display: grid; gap: 6px; font-size: .88rem; }
    .review-reply textarea { width: 100%; min-height: 72px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; font: inherit; resize: vertical; }
    #review-note { white-space: pre-line; }
    .preview-wrap { padding: 24px 20px 28px; display: flex; justify-content: center; }
    .phone {
      width: min(100%, 310px);
      min-height: 575px;
      padding: 11px;
      border: 7px solid var(--ink);
      border-radius: 36px;
      background: var(--ink);
      box-shadow: 0 18px 35px rgba(38, 50, 67, .18);
    }
    .phone-screen {
      height: 100%;
      min-height: 541px;
      overflow: hidden;
      border-radius: 22px;
      background: var(--paper);
    }
    .phone-status { height: 20px; margin: 0 auto; width: 85px; border-radius: 0 0 12px 12px; background: var(--ink); }
    .phone-profile { display: flex; align-items: center; gap: 9px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
    .avatar { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 50%; background: var(--brand); font-size: .72rem; font-weight: 800; }
    .handle { font-size: .8rem; font-weight: 700; overflow-wrap: anywhere; }
    .phone-art {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--brand-pale);
      color: var(--brand-deep);
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .phone-art.is-placeholder { color: var(--muted); font-size: .9rem; font-weight: 400; }
    .phone-actions { padding: 14px; color: var(--brand-deep); letter-spacing: .5em; border-bottom: 1px solid var(--line); }
    .phone-copy { padding: 15px; color: var(--muted); font-size: .8rem; }
    .phone-copy strong { display: block; margin-bottom: 6px; color: var(--ink); }
    .phone-caption { display: block; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
    .phone-caption.is-placeholder { color: var(--muted); }
    .phone-screen.is-fb .phone-profile { border-bottom: 0; }
    .phone-screen.is-fb .phone-copy { padding-top: 0; }
    .phone-screen.is-fb .phone-art { aspect-ratio: 1.65 / 1; }
    .phone-screen.is-fb .phone-art:has(.preview-image) { aspect-ratio: 1 / 1; }
    .phone-screen.is-fb .phone-actions { letter-spacing: 0; display: flex; justify-content: space-around; border-top: 1px solid var(--line); }
    .phone-screen.is-ig .phone-actions { border-bottom: 0; }
    .phone-screen.is-ig .phone-art:has(.ig-carousel) { display: block; }
    .ig-carousel { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-inline: contain; }
    .ig-carousel::-webkit-scrollbar { display: none; }
    .ig-carousel .preview-image { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; }
    .ig-dots { display: flex; justify-content: center; gap: 6px; padding: 8px 0 2px; }
    .ig-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .ig-dot.is-current { background: var(--brand-deep); }
    .phone-screen.is-line { background: #c9dbea; }
    .phone-screen.is-line .line-chat { display: flex; align-items: flex-start; gap: 9px; padding: 22px 12px; }
    .phone-screen.is-line .line-bubble { max-width: calc(100% - 48px); padding: 12px; border-radius: 4px 14px 14px 14px; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .86rem; line-height: 1.5; }
    .phone-screen.is-line .line-messages { flex: 1; min-width: 0; }
    .phone-screen.is-line .line-bubble { max-width: 100%; }
    .phone-screen.is-line .line-image-bubble { width: 100%; aspect-ratio: 1040 / 1040; margin-bottom: 8px; border-radius: 4px 14px 14px 14px; overflow: hidden; background: #fff; }
    .phone-screen.is-line .avatar { flex: none; }
    .preview-image { display: block; width: 100%; height: 100%; object-fit: cover; }
    .post-pictures { padding: 18px 20px; border-top: 1px solid var(--line); }
    .post-pictures h3 { margin: 0 0 12px; font-size: 1rem; }
    .picture-upload { display: inline-block; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
    .picture-upload input { display: none; }
    .picture-thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .picture-thumb { position: relative; width: 76px; height: 76px; }
    .picture-thumb > button:first-child { width: 100%; height: 100%; padding: 0; border: 3px solid transparent; border-radius: 9px; overflow: hidden; cursor: pointer; }
    .picture-thumb.is-main > button:first-child { border-color: var(--brand-deep); }
    .picture-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .picture-remove { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border: 0; border-radius: 50%; background: var(--ink); color: white; cursor: pointer; }
    .storage-usage { margin: 12px 0 0; font-size: .75rem; color: var(--muted); white-space: pre-line; }
    .storage-usage.is-error { color: #b42318; }
    .picture-generator { display: grid; gap: 8px; margin-top: 14px; }
    .picture-generator label { font-size: .84rem; font-weight: 700; }
    .picture-generator textarea { width: 100%; min-height: 80px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; font: inherit; resize: vertical; }
    .picture-generator-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .picture-generator-actions label { display: inline-flex; align-items: center; gap: 5px; }
    .picture-generator-actions select { padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }
    .picture-generator button { justify-self: start; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); cursor: pointer; }
    .picture-generator button:disabled { opacity: .55; cursor: wait; }
    .picture-generation-status { margin: 0; font-size: .8rem; white-space: pre-line; }
    .picture-generation-status.is-error { color: #b42318; }
    .picture-text-settings { display: grid; gap: 8px; margin-top: 14px; }
    .picture-text-settings label { display: grid; gap: 4px; font-size: .84rem; font-weight: 700; }
    .picture-text-settings input, .picture-text-settings select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }
    .picture-text-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .picture-download { justify-self: start; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); cursor: pointer; }
    .picture-download-status { margin: 0; font-size: .8rem; }
    .picture-download-status.is-error { color: #b42318; }
    .preview-image-controls { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; font-size: .8rem; }
    .preview-image-controls button { border: 0; background: transparent; color: var(--ink); cursor: pointer; font-size: 1.1rem; }
    .image-upload { display: block; margin: 12px 20px 0; font-size: .82rem; }
    .image-upload[hidden] { display: none; }
    .image-upload input { display: block; max-width: 100%; margin-top: 7px; }
    .workspace-dialog {
      width: min(720px, calc(100% - 32px));
      max-height: min(85vh, 900px);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .workspace-dialog::backdrop { background: var(--overlay); }
    .dialog-head, .dialog-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .dialog-head h2 { margin: 0; }
    .dialog-fields { display: grid; gap: 16px; margin-top: 20px; }
    .dialog-fields label { display: grid; gap: 7px; font-weight: 700; }
    .dialog-fields textarea, .dialog-fields input, .instruction-text {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.7;
      resize: vertical;
    }
    .dialog-fields input { min-height: 0; }
    .dialog-actions { justify-content: flex-end; margin-top: 18px; }
    .dialog-message { margin: 12px 0 0; min-height: 1.4em; color: var(--muted); font-size: .86rem; }
    .posts-dialog { width: min(1100px, calc(100% - 32px)); }
    .saved-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 20px; max-height: 60vh; overflow-y: auto; }
    .saved-column { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--canvas); }
    .saved-column h3 { margin: 0 0 12px; font-size: 1rem; }
    .saved-column-list { display: grid; align-content: start; gap: 10px; }
    .saved-item { display: grid; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
    .saved-item strong { display: block; overflow-wrap: anywhere; }
    .saved-item time { display: block; color: var(--muted); font-size: .8rem; }
    .saved-item-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .saved-status { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
    .instruction-text { min-height: 390px; margin-top: 18px; }
    @media (max-width: 1100px) {
      .workspace { grid-template-columns: minmax(270px, 1fr) minmax(330px, 1.15fr); }
      .preview-panel { grid-column: 1 / -1; }
      .phone { min-height: 530px; }
      .phone-screen { min-height: 496px; }
    }
    @media (max-width: 700px) {
      .topbar { align-items: flex-start; flex-direction: column; gap: 4px; }
      .topbar-right { width: 100%; justify-content: space-between; }
      .progress-board { align-items: flex-start; flex-direction: column; gap: 8px; }
      .workspace { grid-template-columns: 1fr; }
      .preview-panel { grid-column: auto; }
      .post-editor { min-height: 340px; }
      .saved-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 id="page-title"></h1>
    <div class="topbar-right">
      <p>素材卡・貼文內容・手機預覽</p>
      <button class="topbar-button" id="open-posts" type="button">📁 我的貼文</button>
      <button class="topbar-button" id="new-post" type="button">＋ 新的一篇</button>
      <button class="topbar-button" id="open-settings" type="button">⚙ 設定</button>
    </div>
  </header>

  <nav class="progress-board" aria-label="貼文製作進度">
    <h2>進度看板</h2>
    <ol class="progress-steps" id="progress-steps">
      <li>草稿</li><li>等老闆確認</li><li>完成</li>
    </ol>
  </nav>

  <main class="workspace">
    <section class="panel" aria-labelledby="material-heading">
      <div class="panel-head">
        <p class="eyebrow">素材準備</p>
        <h2 id="material-heading">素材卡</h2>
        <p>先記下已確認的資訊，也標出不能公開的內容。</p>
      </div>
      <form class="form-fields" id="material-fields" autocomplete="off"></form>
      <div class="material-actions">
        <button class="material-button" id="build-instruction" type="button">🧩 組好指令</button>
        <button class="material-button" id="write-with-ai" type="button">✨ 讓 AI 寫</button>
        <button class="material-button" id="paste-response" type="button">📥 貼回</button>
        <button class="material-button" id="save-post" type="button">💾 存檔</button>
        <p class="material-status" id="material-status" role="status" aria-live="polite"></p>
        <p class="material-status" id="ai-usage" role="status" aria-live="polite"></p>
      </div>
      <section class="post-pictures" aria-labelledby="post-pictures-heading">
        <h3 id="post-pictures-heading">🖼 這篇的圖</h3>
        <label class="picture-upload" for="picture-input">📤 上傳<input id="picture-input" type="file" accept="image/*" multiple></label>
        <div class="picture-generator">
          <label for="picture-prompt">圖片描述（要畫什麼）</label>
          <textarea id="picture-prompt" placeholder="寫下希望畫出的畫面"></textarea>
          <div class="picture-generator-actions">
            <button id="generate-picture" type="button">🎨 生圖</button>
            <label for="use-main-reference"><input id="use-main-reference" type="checkbox">用主圖當參考</label>
            <label for="picture-count">張數<select id="picture-count"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select></label>
            <button id="imagine-and-generate" type="button">🪄 AI 想圖再畫</button>
          </div>
          <p class="picture-generation-status" id="picture-generation-status" role="status" aria-live="polite"></p>
        </div>
        <div class="picture-thumbs" id="picture-thumbs"></div>
        <div class="picture-text-settings" id="picture-text-settings">
          <label for="picture-overlay-text">加字／圖上的字<input id="picture-overlay-text" type="text" placeholder="不填就只顯示圖片"></label>
          <div class="picture-text-options">
            <label for="picture-text-position">位置<select id="picture-text-position"><option value="top">上</option><option value="middle">中</option><option value="bottom">下</option></select></label>
            <label for="picture-text-size">大小<select id="picture-text-size"><option value="small">小</option><option value="medium" selected>中</option><option value="large">大</option></select></label>
            <label for="picture-text-style">樣式<select id="picture-text-style"><option value="white-brand">白底主色字</option><option value="black-white">黑底白字</option><option value="white-shadow">白字陰影</option></select></label>
          </div>
          <label for="picture-download-size">下載尺寸<select id="picture-download-size"></select></label>
          <button class="picture-download" id="download-picture" type="button">⬇ 下載這張圖</button>
          <p class="picture-download-status" id="picture-download-status" role="status" aria-live="polite"></p>
        </div>
        <p class="storage-usage" id="storage-usage" role="status" aria-live="polite"></p>
      </section>
    </section>

    <section class="panel" aria-labelledby="editor-heading">
      <div class="panel-head">
        <p class="eyebrow">文案編輯</p>
        <h2 id="editor-heading">貼文工作區</h2>
        <p>可依素材卡產生草稿，也能直接修改貼文內容。</p>
      </div>
      <div class="editor-body">

    const imageThumbs = document.querySelector("#picture-thumbs");

    });
    let postImages = []; // 畫面用 { id, src }；localStorage 只保存 id。
    let mainImageIndex = 0;

    let postContextRevision = 0;
    let activePlatform = SETTINGS.platforms[0];
    let version = 0;
    let previousDraft = "";
    let checkedContent = null;
    let currentPostId = null;
    let reviewIssues = [];

    function updateUndoButton() {
      document.querySelector("#undo-ai").disabled = !aiPreviousPosts;
    }

      rememberPlatform();

    }

      if (!aiPreviousPosts) return;
      rememberPlatform();
      const current = { ...platformPosts };
      SETTINGS.platforms.forEach(platform => {
        platformPosts[platform] = aiPreviousPosts[platform];
        platformChecked[platform] = null;
      });

      updatePreview();
      persistDraft();
      persistAiPostState();
      showFeedback("已切換貼文版本；再按一次可換回來。", "success");
    }

    function openImageWarehouse() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("studio-images", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("imgs");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function imageWarehouse(action, key, value) {
      const database = await openImageWarehouse();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction("imgs", action === "get" || action === "count" ? "readonly" : "readwrite");
        const store = transaction.objectStore("imgs");
        const request = action === "put" ? store.put(value, key)
          : action === "delete" ? store.delete(key) : action === "count" ? store.count() : store.get(key);
        let result;
        request.onsuccess = () => { result = request.result; };
        transaction.oncomplete = () => { database.close(); resolve(result); };
        transaction.onerror = () => { database.close(); reject(transaction.error); };
      });
    }

    function newImageId() {
      return window.crypto?.randomUUID?.() || `img-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    async function storeNewImages(sources) {
      const stored = [];
      try {
        for (const src of sources) {
          const id = newImageId();
          await imageWarehouse("put", id, src);
          stored.push({ id, src });
        }
        return stored;
      } catch (error) {
        await Promise.allSettled(stored.map(image => imageWarehouse("delete", image.id)));
        throw error;
      }
    }

    async function hydrateImageIds(ids) {
      if (!Array.isArray(ids)) return [];
      const entries = await Promise.all(ids.filter(id => typeof id === "string").map(async id => ({
        id, src: id.startsWith("data:image/") ? id : await imageWarehouse("get", id)
      })));
      return entries.filter(image => typeof image.src === "string" && image.src.startsWith("data:image/"));
    }

    async function migrateLegacyImages() {
      const draft = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      const posts = JSON.parse(localStorage.getItem(POSTS_STORAGE_KEY) || "[]");
      const known = new Map();
      async function migrateList(record) {
        if (!record || !Array.isArray(record.images)) return false;
        let changed = false;
        for (let index = 0; index < record.images.length; index += 1) {
          const src = record.images[index];
          if (typeof src !== "string" || !src.startsWith("data:image/")) continue;
          let id = known.get(src);
          if (!id) {
            id = newImageId();
            await imageWarehouse("put", id, src);
            known.set(src, id);
          }
          record.images[index] = id;
          changed = true;
        }
        return changed;
      }
      if (Array.isArray(posts)) {
        let changed = false;
        for (const record of posts) changed = await migrateList(record) || changed;
        if (changed) localStorage.setItem(POSTS_STORAGE_KEY, JSON.stringify(posts));
      }
      if (await migrateList(draft)) localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
    }

    async function updateStorageUsage(error = false) {
      const revision = ++storageUsageRevision;
      storageFailed = error;
      storageUsage.classList.toggle("is-error", error);
      if (error) {
        storageUsage.textContent = "⚠️ 儲存空間不足，剛剛的沒存到！";
        return;
      }
      try {
        let bytes = 0;
        for (let index = 0; index < localStorage.length; index += 1) {
          const key = localStorage.key(index);
          bytes += (key.length + localStorage.getItem(key).length) * 2;
        }
        const count = await imageWarehouse("count");
        let estimate;
        try { estimate = await navigator.storage?.estimate?.(); } catch { /* 部分瀏覽器不提供用量估計。 */ }
        if (revision !== storageUsageRevision) return;
        const total = estimate?.usage != null ? `${(estimate.usage / 1024 / 1024).toFixed(2)} MB` : "無法估算";
        storageUsage.textContent = `瀏覽器的抽屜：已用 ${(bytes / 1024 / 1024).toFixed(2)} MB\n圖片倉庫：${count} 張，這個網站約用 ${total}`;
      } catch {
        if (revision !== storageUsageRevision) return;
        storageUsage.textContent = "無法讀取儲存空間用量。";
      }
    }

    function renderPictures() {
      imageThumbs.replaceChildren();
      postImages.forEach(({ id, src }, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = `picture-thumb ${index === mainImageIndex ? "is-main" : ""}`.trim();
        const select = document.createElement("button");
        select.type = "button";
        select.setAttribute("aria-label", `選第 ${index + 1} 張當主圖`);
        select.setAttribute("aria-pressed", String(index === mainImageIndex));
        const image = document.createElement("img");
        image.src = src;
        image.alt = `第 ${index + 1} 張圖`;
        select.append(image);
        select.addEventListener("click", () => {
          const previous = mainImageIndex;
          mainImageIndex = index;
          if (!persistDraft()) mainImageIndex = previous;
          renderPictures();
          updatePreview();
        });
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "picture-remove";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `刪除第 ${index + 1} 張圖`);
        remove.addEventListener("click", async () => {
          const previousImages = postImages;
          const previousIndex = mainImageIndex;
          postImages = postImages.filter((_, imageIndex) => imageIndex !== index);
          mainImageIndex = postImages.length ? Math.min(index < previousIndex ? previousIndex - 1 : previousIndex, postImages.length - 1) : 0;
          if (!persistDraft()) { postImages = previousImages; mainImageIndex = previousIndex; }
          else {
            try {
              const savedPosts = readSavedPosts();
              const inSavedPost = savedPosts.some(post => Array.isArray(post.images) && (post.images.includes(id) || post.images.includes(src)));
              if (!inSavedPost) await imageWarehouse("delete", id);
            } catch {
              showFeedback("圖片已從這篇移除，但倉庫清理失敗。", "warning");
            }
          }
          renderPictures();
          updatePreview();
          updateStorageUsage();
        });
        wrapper.append(select, remove);
        imageThumbs.append(wrapper);
      });
      updateStorageUsage(storageFailed);
    }

    function resizePicture(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const isDataUrl = typeof file === "string";
        const url = isDataUrl ? file : URL.createObjectURL(file);
        image.onload = () => {
          if (!isDataUrl) URL.revokeObjectURL(url);
          const scale = Math.min(1, 1080 / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext("2d");
          if (!context) { reject(new Error("無法處理圖片")); return; }
          context.fillStyle = "#fff";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
        image.onerror = () => { if (!isDataUrl) URL.revokeObjectURL(url); reject(new Error("無法讀取圖片")); };
        image.src = url;
      });
    }

    function pictureTextSettings() {
      return {
        text: overlayText.value,
        position: textPosition.value,
        size: textSize.value,
        style: textStyle.value,
        downloadSize: downloadSize.value
      };
    }

    function applyPictureTextSettings(saved = {}) {
      saved = saved && typeof saved === "object" ? saved : {};
      overlayText.value = typeof saved.text === "string" ? saved.text : "";
      textPosition.value = ["top", "middle", "bottom"].includes(saved.position) ? saved.position : "top";
      textSize.value = ["small", "medium", "large"].includes(saved.size) ? saved.size : "medium";
      textStyle.value = ["white-brand", "black-white", "white-shadow"].includes(saved.style) ? saved.style : "white-brand";
      downloadSize.value = Object.hasOwn(SIZES, saved.downloadSize) ? saved.downloadSize : "platform";
    }

    function loadPicture(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("圖片無法讀取"));
        image.src = src;
      });
    }

    async function composePicture(src, width, height, settings) {
      const image = await loadPicture(src);
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      if (!context) throw new Error("無法建立圖片畫布");
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const sourceWidth = width / scale;
      const sourceHeight = height / scale;
      context.drawImage(image, (image.naturalWidth - sourceWidth) / 2, (image.naturalHeight - sourceHeight) / 2,
        sourceWidth, sourceHeight, 0, 0, width, height);
      const content = settings.text.replace(/\s+/g, " ").trim();
      if (!content) return canvas;

      const fontSize = Math.round(width * ({ small: .045, medium: .065, large: .085 }[settings.size] || .065));
      const lineHeight = fontSize * 1.3;
      const fontFamily = getComputedStyle(document.body).fontFamily;
      context.font = `700 ${fontSize}px ${fontFamily}`;
      context.textAlign = "center";
      context.textBaseline = "middle";
      const limit = width * .84;
      const lines = [];
      let line = "";
      for (const character of Array.from(content)) {
        if (context.measureText(line + character).width > limit && line) {
          lines.push(line);
          line = character;
          if (lines.length === 3) break;
        } else line += character;
      }
      if (lines.length < 3 && line) lines.push(line);
      if (lines.length === 3 && lines.join("").length < Array.from(content).length) {
        let last = lines[2];
        while (last && context.measureText(`${last}…`).width > limit) last = last.slice(0, -1);
        lines[2] = `${last}…`;
      }
      const blockHeight = lines.length * lineHeight;
      const centerY = settings.position === "top" ? height * .08 + blockHeight / 2
        : settings.position === "bottom" ? height * .92 - blockHeight / 2 : height / 2;
      const maxLineWidth = Math.max(...lines.map(value => context.measureText(value).width));
      if (settings.style !== "white-shadow") {
        const paddingX = fontSize * .55;
        const paddingY = fontSize * .35;
        const boxWidth = Math.min(width * .92, maxLineWidth + paddingX * 2);
        const boxHeight = blockHeight + paddingY * 2;
        const left = (width - boxWidth) / 2;
        const top = centerY - boxHeight / 2;
        const radius = fontSize * .35;
        context.fillStyle = settings.style === "black-white" ? "rgba(0, 0, 0, .72)" : "rgba(255, 255, 255, .84)";
        context.beginPath();
        context.moveTo(left + radius, top);
        context.lineTo(left + boxWidth - radius, top);
        context.quadraticCurveTo(left + boxWidth, top, left + boxWidth, top + radius);
        context.lineTo(left + boxWidth, top + boxHeight - radius);
        context.quadraticCurveTo(left + boxWidth, top + boxHeight, left + boxWidth - radius, top + boxHeight);
        context.lineTo(left + radius, top + boxHeight);
        context.quadraticCurveTo(left, top + boxHeight, left, top + boxHeight - radius);
        context.lineTo(left, top + radius);
        context.quadraticCurveTo(left, top, left + radius, top);
        context.fill();
      }
      context.fillStyle = settings.style === "white-brand"
        ? getComputedStyle(document.documentElement).getPropertyValue("--brand").trim() : "#fff";
      if (settings.style === "white-shadow") {
        context.shadowColor = "rgba(0, 0, 0, .9)";
        context.shadowBlur = fontSize * .18;
        context.shadowOffsetY = fontSize * .05;
      }
      lines.forEach((value, index) => context.fillText(value, width / 2,
        centerY + (index - (lines.length - 1) / 2) * lineHeight, limit));
      return canvas;
    }

    async function showComposedPreview(image, src, width, height, revision) {
      if (!overlayText.value.trim()) return;
      try {
        const canvas = await composePicture(src, width, height, pictureTextSettings());
        if (revision === previewRenderRevision && phoneScreen.contains(image)) image.src = canvas.toDataURL("image/png");
      } catch {
        downloadStatus.classList.add("is-error");
        downloadStatus.textContent = "加字預覽失敗，請重新選擇主圖。";
      }
    }

    async function downloadPicture() {
      downloadStatus.classList.remove("is-error");
      if (!postImages.length) {
        downloadStatus.classList.add("is-error");
        downloadStatus.textContent = "請先上傳或生成一張圖。";
        return;
      }
      const button = document.querySelector("#download-picture");
      const platform = activePlatform;
      const src = postImages[mainImageIndex].src;
      const settings = pictureTextSettings();
      button.disabled = true;
      downloadStatus.textContent = "正在準備 PNG…";
      try {
        const choice = SIZES[downloadSize.value] || SIZES.platform;
        const [width, height] = choice.size || PIC_SIZE[platform] || PIC_SIZE.IG;
        await document.fonts.ready;
        const canvas = await composePicture(src, width, height, settings);
        const blob = await new Promise((resolve, reject) => canvas.toBlob(value => value ? resolve(value) : reject(new Error("無法輸出 PNG")), "image/png"));
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const name = `${SETTINGS.brandName}_${choice.size ? choice.label : platform}_${width}x${height}`.replace(/[\\/:*?"<>|]/g, "_");
        link.download = `${name}.png`;
        link.href = url;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        downloadStatus.textContent = `已準備 ${width}×${height} PNG。`;
      } catch (error) {
        downloadStatus.classList.add("is-error");
        downloadStatus.textContent = error.message || "無法下載圖片。";
      } finally {
        button.disabled = false;
      }
    }

    function updatePreview() {
      const revision = ++previewRenderRevision;
      const topic = getMaterial()["貼文主題"];
      const caption = editor.value.trim() || "貼文文字預覽位置";
      phoneScreen.className = `phone-screen is-${activePlatform.toLowerCase()}`;
      if (activePlatform === "LINE") {
        phoneScreen.innerHTML = '<div class="phone-status" aria-hidden="true"></div><div class="line-chat"><div class="avatar" aria-hidden="true">hm</div><div class="line-messages"><div class="line-image-bubble"></div><div class="line-bubble"></div></div></div>';
        phoneScreen.querySelector(".line-bubble").textContent = caption;
        if (postImages.length) {
          const picture = document.createElement("img");
          picture.className = "preview-image";
          picture.src = postImages[mainImageIndex].src;
          picture.alt = "LINE 貼文主圖";
          phoneScreen.querySelector(".line-image-bubble").append(picture);
          showComposedPreview(picture, postImages[mainImageIndex].src, ...PIC_SIZE.LINE, revision);
        } else phoneScreen.querySelector(".line-image-bubble").remove();
        return;
      }
      const profile = '<div class="phone-profile"><div class="avatar" aria-hidden="true">hm</div><div class="handle"></div></div>';
      const art = '<div class="phone-art"></div>';
      const copy = '<div class="phone-copy"><span class="phone-caption"></span></div>';
      const actions = `<div class="phone-actions" aria-hidden="true">${activePlatform === "FB" ? "讚　　留言　　分享" : "♡ 💬 ➤"}</div>`;
      phoneScreen.innerHTML = '<div class="phone-status" aria-hidden="true"></div>' + profile + (activePlatform === "FB" ? copy + art + actions : art + actions + copy);
      phoneScreen.querySelector(".handle").textContent = activePlatform === "FB" ? `${SETTINGS.brandName} · 剛剛` : SETTINGS.accountName;
      phoneScreen.querySelector(".phone-caption").textContent = activePlatform === "IG" ? `${SETTINGS.accountName}  ${caption}` : caption;
      const artBox = phoneScreen.querySelector(".phone-art");
      if (postImages.length) {
        if (activePlatform === "IG") {
          const carousel = document.createElement("div");
          carousel.className = "ig-carousel";
          carousel.setAttribute("aria-label", "IG 貼文圖片，可左右滑動");
          const orderedImages = [postImages[mainImageIndex], ...postImages.filter((_, index) => index !== mainImageIndex)];
          orderedImages.forEach(({ src }, index) => {
            const image = document.createElement("img");
            image.className = "preview-image";
            image.src = src;
            image.alt = `IG 貼文圖片 ${index + 1} / ${orderedImages.length}`;
            carousel.append(image);
            if (index === 0) showComposedPreview(image, src, ...PIC_SIZE.IG, revision);
          });
          artBox.replaceChildren(carousel);
          if (orderedImages.length > 1) {
            const dots = document.createElement("div");
            dots.className = "ig-dots";
            dots.setAttribute("aria-label", `共 ${orderedImages.length} 張圖片`);
            const indicators = orderedImages.map((_, index) => {
              const dot = document.createElement("span");
              dot.className = `ig-dot ${index === 0 ? "is-current" : ""}`.trim();
              dots.append(dot);
              return dot;
            });
            carousel.addEventListener("scroll", () => {
              const current = Math.min(indicators.length - 1, Math.round(carousel.scrollLeft / carousel.clientWidth));
              indicators.forEach((dot, index) => dot.classList.toggle("is-current", index === current));
            }, { passive: true });
            artBox.after(dots);
          }
        } else {
          const image = document.createElement("img");
          image.className = "preview-image";
          image.alt = `${activePlatform} 貼文主圖`;
          image.src = postImages[mainImageIndex].src;
          artBox.replaceChildren(image);
          showComposedPreview(image, postImages[mainImageIndex].src, ...(PIC_SIZE[activePlatform] || PIC_SIZE.IG), revision);
        }
        artBox.style.padding = "0";
        const [width, height] = PIC_SIZE[activePlatform] || PIC_SIZE.IG;
        artBox.style.aspectRatio = `${width} / ${height}`;
      } else {
        artBox.textContent = topic || "貼文圖片預覽位置";
        artBox.classList.add("is-placeholder");
      }
    }

    function rememberPlatform() {
      platformPosts[activePlatform] = editor.value;
      platformVersions[activePlatform] = version;
      platformPrevious[activePlatform] = previousDraft;
      platformChecked[activePlatform] = checkedContent;
    }

    function selectPlatform(platform) {
      if (!SETTINGS.platforms.includes(platform)) return;
      rememberPlatform();
      activePlatform = platform;
      editor.value = platformPosts[platform] || "";
      version = platformVersions[platform] || 0;
      previousDraft = platformPrevious[platform] || "";
      checkedContent = platformChecked[platform] || null;
      restoreButton.classList.toggle("is-visible", Boolean(previousDraft));
      [...tabContainer.children].forEach(tab => tab.setAttribute("aria-selected", String(tab.textContent === platform)));
      showFeedback("");
      updatePreview();
      renderHelperHistory();
      updateProgress();
      persistDraft();
    }

    function updateProgress() {
      const stage = POST_STATUSES.indexOf(currentStatus);
      progressSteps.forEach((step, index) => {
        step.classList.toggle("is-current", index === stage);
        step.classList.toggle("is-done", index < stage);
        if (index === stage) step.setAttribute("aria-current", "step");
        else step.removeAttribute("aria-current");
      });
    }

    function invalidateCheck() {
      checkedContent = null;
      platformChecked[activePlatform] = null;
      updateProgress();
    }

    function missingRequired(material) {
      return SETTINGS.materialFields
        .filter(field => field.required && !material[field.label])
        .map(field => field.label);
    }

    function makeDraft(material, variant) {
      const topic = material["貼文主題"];
      const feeling = material["穿搭感受"];
      const details = [material["商品資訊"], material["適合誰"]].filter(Boolean);
      const facts = [material["日期與時間"], material["價格與活動條件"]].filter(Boolean);
      const versions = [
        [topic, feeling, ...details, "", ...facts],
        [feeling, ...details, "", topic, ...facts, "♡"],
        [`✦ ${topic}`, "", feeling, ...details, "", ...facts]
      ];
      return versions[variant % versions.length].join("\n").trim();
    }

    function generateDraft(isRegeneration) {
      const material = getMaterial();
      const missing = missingRequired(material);
      if (missing.length) {
        showFeedback(`請先填寫必填欄位：${missing.join("、")}。若沒有暫不公開或未確認的資訊，請填「無」。`, "warning");
        document.querySelector(`#material-${SETTINGS.materialFields.findIndex(field => field.label === missing[0]) + 1}`).focus();
        return;
      }
      if (isRegeneration && !editor.value.trim()) {
        showFeedback("目前沒有草稿，請先按「產生草稿」。", "warning");
        return;
      }
      if (editor.value.trim()) {
        previousDraft = editor.value;
        restoreButton.classList.add("is-visible");
      }
      version = isRegeneration ? version + 1 : 0;
      editor.value = makeDraft(material, version);
      invalidateCheck();
      rememberPlatform();
      updatePreview();
      showFeedback(isRegeneration ? "已產生另一版；可按「還原上一版」取回原文。" : "草稿已產生，請確認內容並自行調整。", "success");
      persistDraft();
    }

    function sensitiveFragments(value) {
      return value.split(/[\n，,、；;]/).map(part => part.trim()).filter(part => part && !/^(無|沒有|無。|沒有。)$/.test(part));
    }

    function runPrepublishCheck() {
      const material = getMaterial();
      const post = editor.value.trim();
      const problems = [];
      const missing = missingRequired(material);
      if (missing.length) problems.push(`必填欄位未填：${missing.join("、")}`);
      if (!post) problems.push("貼文內容尚未填寫");
      const forbidden = FORBIDDEN_PHRASES.filter(phrase => post.includes(phrase));
      if (forbidden.length) problems.push(`含不能用的字句：${forbidden.join("、")}`);
      const restricted = sensitiveFragments(material["先不要講的"] || "").filter(phrase => post.includes(phrase));
      if (restricted.length) problems.push(`含暫不公開內容：${restricted.join("、")}`);
      const uncertain = sensitiveFragments(material["❓ 還不確定的"] || "").filter(phrase => post.includes(phrase));
      if (uncertain.length) problems.push(`含未確認資訊：${uncertain.join("、")}`);
      if (/活動|優惠|抽獎/.test(material["貼文主題"] || "") && !material["價格與活動條件"]) {
        problems.push("活動貼文缺少價格與活動條件");
      }
      if (problems.length) {
        checkedContent = null;
        updateProgress();
        showFeedback(`請先處理以下項目：\n• ${problems.join("\n• ")}`, "warning");
        return;
      }
      checkedContent = editor.value;
      platformChecked[activePlatform] = checkedContent;
      updateProgress();
      showFeedback("檢查通過：可使用「一鍵複製」。請在發布前再核對實際商品與活動資訊。", "success");
    }

    async function copyPost() {
      if (!editor.value.trim()) {
        showFeedback("貼文內容尚未填寫。", "warning");
        return;
      }
      if (checkedContent !== editor.value) {
        showFeedback("請先完成「發布前檢查」，再複製貼文。", "warning");
        return;
      }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(editor.value);
        } else {
          editor.focus();
          editor.select();
          if (!document.execCommand("copy")) throw new Error("複製失敗");
          editor.setSelectionRange(editor.value.length, editor.value.length);
        }
        showFeedback("貼文內容已複製。", "success");
      } catch {
        showFeedback("無法自動複製，請選取貼文內容後手動複製。", "warning");
      }
    }

    function persistDraft() {
      try {
        rememberPlatform();
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          material: getMaterial(),
          posts: platformPosts,
          versions: platformVersions,
          platform: activePlatform,
          postId: currentPostId,
          status: currentStatus,
          helperHistory,
          aiPreviousPosts,
          images: postImages.map(image => image.id),
          mainImageIndex,
          pictureText: pictureTextSettings()
        }));
        updateStorageUsage();
        return true;
      } catch {
        updateStorageUsage(true);
        return false;
      }
    }

    function saveDraft() {
      const saved = persistDraft();
      showFeedback(saved ? "草稿已保存在這台瀏覽器。" : "瀏覽器無法儲存草稿，請先複製文字備份。", saved ? "success" : "warning");
    }

    async function loadDraft() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!saved || typeof saved !== "object") return;
        SETTINGS.materialFields.forEach((field, index) => {
          const value = saved.material && saved.material[field.label];
          if (typeof value === "string") document.querySelector(`#material-${index + 1}`).value = value;
        });
        if (saved.posts && typeof saved.posts === "object") {
          SETTINGS.platforms.forEach(platform => {
            if (typeof saved.posts[platform] === "string") platformPosts[platform] = saved.posts[platform];
            if (saved.versions && Number.isInteger(saved.versions[platform])) platformVersions[platform] = saved.versions[platform];
          });
        } else if (typeof saved.post === "string") {
          platformPosts.IG = saved.post;
          if (Number.isInteger(saved.version)) platformVersions.IG = saved.version;
          activePlatform = "IG";
        }
        activePlatform = SETTINGS.platforms.includes(saved.platform) ? saved.platform : activePlatform;
        currentPostId = typeof saved.postId === "string" ? saved.postId : null;
        postImages = await hydrateImageIds(saved.images);
        mainImageIndex = Number.isInteger(saved.mainImageIndex) && saved.mainImageIndex >= 0 && saved.mainImageIndex < postImages.length ? saved.mainImageIndex : 0;
        applyPictureTextSettings(saved.pictureText);
        currentStatus = POST_STATUSES.includes(saved.status) ? saved.status : POST_STATUSES[0];
        SETTINGS.platforms.forEach(platform => {
          helperHistory[platform] = Array.isArray(saved.helperHistory?.[platform])
            ? saved.helperHistory[platform].filter(message => ["user", "assistant"].includes(message?.role) && typeof message.content === "string").slice(-8)
            : [];
        });
        aiPreviousPosts = SETTINGS.platforms.every(platform => typeof saved.aiPreviousPosts?.[platform] === "string")
          ? { ...saved.aiPreviousPosts } : null;
        editor.value = platformPosts[activePlatform] || "";
        version = platformVersions[activePlatform] || 0;
        [...tabContainer.children].forEach(tab => tab.setAttribute("aria-selected", String(tab.textContent === activePlatform)));
        showFeedback("已載入這台瀏覽器儲存的草稿。", "success");
      } catch {
        showFeedback("無法讀取先前儲存的草稿。", "warning");
      }
      updatePreview();
      renderPictures();
      renderHelperHistory();
      updateUndoButton();
      updateProgress();
    }

    function readSavedPosts() {
      const saved = JSON.parse(localStorage.getItem(POSTS_STORAGE_KEY) || "[]");
      if (!Array.isArray(saved)) throw new Error("存檔格式錯誤");
      return saved;
    }

    function persistAiPostState() {
      if (!currentPostId) return true;
      try {
        const posts = readSavedPosts();
        const record = posts.find(post => post.id === currentPostId);
        if (!record) return true;
        record.posts = { ...platformPosts };
        record.helperHistory = Object.fromEntries(SETTINGS.platforms.map(platform => [platform, helperHistory[platform].map(message => ({ ...message }))]));
        record.aiPreviousPosts = aiPreviousPosts && { ...aiPreviousPosts };
        localStorage.setItem(POSTS_STORAGE_KEY, JSON.stringify(posts));
        return true;
      } catch {
        return false;
      }
    }

    async function savePost() {
      try {
        rememberPlatform();
        const posts = readSavedPosts();
        const material = getMaterial();
        const name = `${material["日期與時間"] || "未填日期"}＋${material["貼文主題"] || "未填主題"}`;
        const id = currentPostId || (window.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
        const record = { id, name, savedAt: new Date().toISOString(), material, posts: { ...platformPosts }, status: currentStatus,
          images: postImages.map(image => image.id), mainImageIndex, pictureText: pictureTextSettings(),
          helperHistory: Object.fromEntries(SETTINGS.platforms.map(platform => [platform, helperHistory[platform].map(message => ({ ...message }))])),
          aiPreviousPosts: aiPreviousPosts && { ...aiPreviousPosts } };
        const index = posts.findIndex(post => post.id === id);
        if (index >= 0) posts[index] = record;
        else posts.push(record);
        localStorage.setItem(POSTS_STORAGE_KEY, JSON.stringify(posts));
        updateStorageUsage();
        currentPostId = id;
        persistDraft();
        showFeedback("這篇貼文已存檔。", "success");
      } catch {
        updateStorageUsage(true);
        showFeedback("瀏覽器無法存檔，請先複製文字備份。", "warning");
      }
    }

    async function openPost(record) {
      postContextRevision += 1;
      try {
        await migrateLegacyImages();
        record = readSavedPosts().find(post => post.id === record.id) || record;
      } catch {
        showFeedback("舊圖片搬入倉庫失敗，原始存檔仍保留。", "warning");
      }
      SETTINGS.materialFields.forEach((field, index) => {
        document.querySelector(`#material-${index + 1}`).value = typeof record.material?.[field.label] === "string" ? record.material[field.label] : "";
      });
      SETTINGS.platforms.forEach(platform => {
        platformPosts[platform] = typeof record.posts?.[platform] === "string" ? record.posts[platform] : "";
        platformVersions[platform] = 0;
        platformPrevious[platform] = "";
        platformChecked[platform] = null;
        helperHistory[platform] = Array.isArray(record.helperHistory?.[platform])
          ? record.helperHistory[platform].filter(message => ["user", "assistant"].includes(message?.role) && typeof message.content === "string").slice(-8)
          : [];
      });
      aiPreviousPosts = SETTINGS.platforms.every(platform => typeof record.aiPreviousPosts?.[platform] === "string")
        ? { ...record.aiPreviousPosts } : null;
      currentPostId = record.id;
      try { postImages = await hydrateImageIds(record.images); }
      catch { postImages = []; showFeedback("無法從圖片倉庫讀取這篇的圖。", "warning"); }
      mainImageIndex = Number.isInteger(record.mainImageIndex) && record.mainImageIndex >= 0 && record.mainImageIndex < postImages.length ? record.mainImageIndex : 0;
      applyPictureTextSettings(record.pictureText);

    function renderSavedPosts() {
      const list = document.querySelector("#saved-list");
      const message = document.querySelector("#posts-message");
      list.replaceChildren();
      try {
        const posts = readSavedPosts().sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
        message.textContent = posts.length ? "" : "目前沒有存過的貼文。";
        const columns = Object.fromEntries(POST_STATUSES.map(status => {
          const column = document.createElement("section");
          column.className = "saved-column";
          const heading = document.createElement("h3");
          heading.textContent = `${status}（${posts.filter(post => (POST_STATUSES.includes(post.status) ? post.status : POST_STATUSES[0]) === status).length}）`;
          const contents = document.createElement("div");
          contents.className = "saved-column-list";
          column.append(heading, contents);
          list.append(column);
          return [status, contents];
        }));
        posts.forEach(record => {
          const row = document.createElement("div");
          row.className = "saved-item";
          const details = document.createElement("div");
          const name = document.createElement("strong");
          name.textContent = record.name;
          const time = document.createElement("time");
          time.dateTime = record.savedAt;
          time.textContent = `存檔時間：${new Date(record.savedAt).toLocaleString("zh-TW")}`;
          details.append(name, time);
          const actions = document.createElement("div");
          actions.className = "saved-item-actions";
          const status = document.createElement("select");
          status.className = "saved-status";

            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            status.append(option);
          });
          status.value = POST_STATUSES.includes(record.status) ? record.status : POST_STATUSES[0];
          status.addEventListener("change", () => {
            try {
              const currentPosts = readSavedPosts();
              const target = currentPosts.find(post => post.id === record.id);
              if (!target) throw new Error("貼文不存在");
              target.status = status.value;
              localStorage.setItem(POSTS_STORAGE_KEY, JSON.stringify(currentPosts));
              if (currentPostId === record.id) {
                currentStatus = status.value;
                updateProgress();
                persistDraft();
              }
              renderSavedPosts();
            } catch {
              message.textContent = "狀態更新失敗，請稍後再試。";
              status.value = POST_STATUSES.includes(record.status) ? record.status : POST_STATUSES[0];
            }
          });
          const open = document.createElement("button");
          open.className = "dialog-button";
          open.type = "button";
          open.textContent = "打開";
          open.addEventListener("click", () => openPost(record));
          const remove = document.createElement("button");
          remove.className = "dialog-button";
          remove.type = "button";
          remove.textContent = "刪除";
          remove.addEventListener("click", async () => {
            if (!window.confirm("確定嗎？")) return;
            try {
              localStorage.setItem(POSTS_STORAGE_KEY, JSON.stringify(readSavedPosts().filter(post => post.id !== record.id)));
              updateStorageUsage();
              if (currentPostId === record.id) {
                currentPostId = null;
                persistDraft();
              }
              renderSavedPosts();
            } catch {
              message.textContent = "刪除失敗，請稍後再試。";
            }
          });
          actions.append(open, remove);
          row.append(details, status, actions);
          columns[status.value].append(row);
        });

        message.textContent = "無法讀取存過的貼文。";
      }
    }

    function addWeekdays(value) {
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      return value.replace(/\b(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})(?!\d|\s*[（(][日一二三四五六][）)])/g, (original, yearText, monthText, dayText) => {
        const year = Number(yearText);
        const month = Number(monthText);
        const day = Number(dayText);
        const date = new Date(year, month - 1, day);
        if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return original;
        return `${yearText}/${monthText.padStart(2, "0")}/${dayText.padStart(2, "0")}（${weekdays[date.getDay()]}）`;
      });
    }

    function buildInstruction(showDialog = true) {
      const material = getMaterial();

        `回覆格式：每個平台用${platformHeadings}這樣的標題分開；若有待確認問題，放在【要問我的】標題下。只輸出貼文與待確認問題，不要輸出檢查清單或檢查過程。`,
        `品牌規格：\n${brandSpecification.value.trim() || "（未填）"}`,
        `素材卡：\n${materialLines.join("\n")}`
      ];
      if (reviewChecklist.value.trim()) {
        sections.push(`寫完照這張清單檢查，有 ❌ 先自己改好\n${reviewChecklist.value.trim()}`);
      }
      instructionText.value = sections.join("\n\n");

    function withoutAiChecklist(text) {
      // AI 有時會在貼文後附上自己的檢查結果；只移除獨立成行的檢查段落。
      const checklistHeading = /^[ \t]*(?:#{1,6}[ \t]*)?(?:【(?:檢查清單|檢查結果|自我檢查|審核清單)】|(?:檢查清單|檢查結果|自我檢查|審核清單)[：:])[ \t]*$/m;
      const heading = checklistHeading.exec(text);
      return (heading ? text.slice(0, heading.index) : text).trim();
    }

    function applyResponse(responseText, fromAi = false) {
      // 檢查段落是分隔點，但不屬於任何平台的貼文。
      const headings = [...responseText.matchAll(/【(FB|IG|LINE|要問我的|檢查清單|檢查結果|自我檢查|審核清單)】/g)];
      const sections = {};
      headings.forEach((heading, index) => {
        const end = headings[index + 1]?.index ?? responseText.length;
        const content = responseText.slice(heading.index + heading[0].length, end);
        sections[heading[1]] = SETTINGS.platforms.includes(heading[1]) ? withoutAiChecklist(content) : content.trim();
      });
      if (SETTINGS.platforms.some(platform => !sections[platform])) {
        throw new Error("回覆缺少【FB】【IG】【LINE】標題或貼文內容，請檢查後再貼回。");
      }
      rememberPlatform();
      if (fromAi) rememberAiSnapshot();
      SETTINGS.platforms.forEach(platform => {
        platformPrevious[platform] = platformPosts[platform];
        platformPosts[platform] = sections[platform];
        platformChecked[platform] = null;
